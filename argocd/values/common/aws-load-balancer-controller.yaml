region: eu-west-2
serviceAccount:
  create: true
  name: aws-load-balancer-controller
  
# Traefik owns the Service of type LoadBalancer, so the service mutator
# webhook is not needed and only adds a failure mode during rollout.
enableServiceMutatorWebhook: false
replicaCount: 1
resources:
  requests:
    cpu: 10m
    memory: 64Mi

configs:
  params:
    server.insecure: "true"
  cm:
    application.instanceLabelKey: argocd.argoproj.io/instance
server:
  replicas: 1
  ingress:
    enabled: true
    ingressClassName: traefik
    path: /
    pathType: Prefix
    tls: true
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
controller:
  replicas: 1
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

applicationSet:
  replicas: 1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo-backend
  namespace: podinfo
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: backend
          image:  # Replace with ECR image
          ports:
            - containerPort: 9898 
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          env:
            - name: PODINFO_CACHE_SERVER
              value: "tcp://redis-service:6379" # Native podinfo Redis flag
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9898
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 9898
            initialDelaySeconds: 3
            periodSeconds: 5

# Service

apiVersion: v1
kind: Service
metadata:
  name: podinfo-backend-service
  namespace: podinfo
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: 9898
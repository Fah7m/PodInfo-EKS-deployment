apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Fah7m/PodInfo-EKS-deployment
    targetRevision: HEAD
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc 
    namespace: argocd
  syncPolicy: 
    automated:
      prune: true
      selfHeal: true

    
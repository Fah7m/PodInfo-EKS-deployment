apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://kubernetes-sigs.github.io/external-dns/
      chart: external-dns
      targetRevision: 1.15.2
      helm:
        releaseName: external-dns
        valueFiles:
          - $values/argocd/values/common/external-dns.yaml
          - $values/argocd/values/{{ required "env is required" .Values.env }}/external-dns.yaml
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ required "revision is required" .Values.revision }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

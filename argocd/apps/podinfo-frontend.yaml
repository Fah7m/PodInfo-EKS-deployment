apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo-frontend
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Fah7m/PodInfo-EKS-deployment
    targetRevision: main
    path: argocd/base/podinfo-frontend
  destination:
    server: https://kubernetes.default.svc
    namespace: podinfo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
